<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Appointment & Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        medical: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6', // Main Teal
                            600: '#0d9488', // Darker Teal
                            700: '#0f766e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 font-sans text-slate-800">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden">
        
        <div class="bg-medical-600 p-6 text-center">
            <h1 class="text-3xl font-bold text-white tracking-wide">APPOINTMENT FORM</h1>
            <p class="text-medical-100 mt-2 text-sm">Secure Payment Gateway</p>
        </div>

        <form action="finish.html" method="POST" onsubmit="handlePayment(event)" class="p-8 space-y-8">
            
            <div>
                <h2 class="text-xl font-bold text-slate-700 border-b pb-2 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-medical-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    Personal Information
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="block text-sm font-medium text-slate-600">Full Name *</label>
                        <input type="text" name="name" placeholder="Full Name" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-medical-500 outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-sm font-medium text-slate-600">Father's Name *</label>
                        <input type="text" name="father_name" placeholder="Father's Name" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-medical-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                    <div class="space-y-1">
                        <label class="block text-sm font-medium text-slate-600">Mobile No *</label>
                        <input type="number" name="mobile" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-medical-500 outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-sm font-medium text-slate-600">Email ID</label>
                        <input type="email" name="email" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-medical-500 outline-none">
                    </div>
                </div>
            </div>

            <div class="bg-slate-50 p-6 rounded-lg border border-slate-200">
                <h2 class="text-xl font-bold text-slate-700 border-b pb-2 mb-6 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-medical-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    Payment Details
                </h2>

                <div class="mb-6">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Select Payment Method *</label>
                    <select id="payment_method" name="payment_method" onchange="togglePaymentFields()" required 
                        class="w-full px-4 py-3 bg-white border-2 border-medical-100 rounded-lg focus:border-medical-500 focus:ring-0 outline-none text-slate-700 font-medium">
                        <option value="">-- Choose Option --</option>
                        <option value="card">Credit / Debit Card (Visa/Rupay)</option>
                        <option value="upi">UPI (GPay, PhonePe, Paytm)</option>
                        <option value="netbanking">Net Banking</option>
                    </select>
                </div>

                <div id="section_card" class="hidden space-y-4 animate-fade-in">
                    <div class="p-4 bg-white border border-slate-200 rounded-md">
                        <p class="text-sm text-slate-500 mb-4 font-semibold">Enter Card Details:</p>
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase">Card Number</label>
                                <input type="number" id="input_card_num" name="card_number" placeholder="0000 0000 0000 0000" class="w-full mt-1 p-2 border rounded focus:ring-medical-500 focus:border-medical-500 outline-none">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs font-bold text-slate-500 uppercase">Expiry Date</label>
                                    <input type="text" id="input_card_exp" name="expiry" placeholder="MM/YY" class="w-full mt-1 p-2 border rounded focus:ring-medical-500 outline-none">
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-slate-500 uppercase">CVV</label>
                                    <input type="password" id="input_card_cvv" name="cvv" maxlength="3" placeholder="123" class="w-full mt-1 p-2 border rounded focus:ring-medical-500 outline-none">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="section_upi" class="hidden space-y-4 animate-fade-in">
                    <div class="p-6 bg-white border border-slate-200 rounded-md flex flex-col items-center text-center">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/UPI-Logo-vector.svg/1200px-UPI-Logo-vector.svg.png" alt="UPI" class="h-8 mb-4">
                        <label class="w-full text-left text-xs font-bold text-slate-500 uppercase">Enter UPI ID</label>
                        <input type="text" id="input_upi_id" name="upi_id" placeholder="mobileNumber@upi" 
                            class="w-full mt-1 p-3 border border-slate-300 rounded focus:ring-2 focus:ring-medical-500 outline-none">
                        <p class="text-xs text-slate-400 mt-2">Open your UPI app to approve the request after clicking Pay.</p>
                    </div>
                </div>

                <div id="section_netbanking" class="hidden space-y-4 animate-fade-in">
                    <div class="p-4 bg-white border border-slate-200 rounded-md space-y-4">
                        <p class="text-sm text-slate-500 mb-2 font-semibold">Net Banking Information:</p>
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase">Select Bank</label>
                            <select id="input_bank_name" name="bank_name" class="w-full mt-1 p-2 border rounded bg-white">
                                <option value="">-- Select Bank --</option>
                                <option value="sbi">State Bank of India</option>
                                <option value="hdfc">HDFC Bank</option>
                                <option value="icici">ICICI Bank</option>
                                <option value="axis">Axis Bank</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase">Account No.</label>
                                <input type="password" id="input_bank_acc" name="account_no" class="w-full mt-1 p-2 border rounded focus:ring-medical-500 outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase">IFSC Code</label>
                                <input type="text" id="input_bank_ifsc" name="ifsc" class="w-full mt-1 p-2 border rounded focus:ring-medical-500 outline-none">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="flex gap-4 pt-4">
                <button type="submit" class="flex-1 bg-medical-600 text-white font-bold py-3 px-6 rounded-lg shadow hover:bg-medical-700 transition duration-300">
                    Pay Now
                </button>
                <button type="reset" onclick="resetForm()" class="flex-1 bg-slate-200 text-slate-700 font-bold py-3 px-6 rounded-lg hover:bg-slate-300 transition duration-300">
                    Reset
                </button>
            </div>

        </form>
    </div>

    <div id="processing_overlay" class="fixed inset-0 bg-slate-900 bg-opacity-75 hidden flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-xl shadow-2xl text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-teal-600 mx-auto mb-4"></div>
            <h2 class="text-xl font-bold text-slate-700">Processing Payment...</h2>
            <p class="text-slate-500 text-sm mt-2">Please do not close this window.</p>
        </div>
    </div>

    <script>
        function handlePayment(event) {
            event.preventDefault();

            const overlay = document.getElementById('processing_overlay');
            overlay.classList.remove('hidden');

            setTimeout(() => {
                window.location.href = "finish.html";
            }, 2000);
        }

        function togglePaymentFields() {
            const method = document.getElementById('payment_method').value;

            // Get all sections
            const cardSection = document.getElementById('section_card');
            const upiSection = document.getElementById('section_upi');
            const netSection = document.getElementById('section_netbanking');

            // Get all inputs to manage 'required' attribute
            const cardInputs = cardSection.querySelectorAll('input');
            const upiInputs = upiSection.querySelectorAll('input');
            const netInputs = netSection.querySelectorAll('input, select');

            // Helper function to hide section and remove 'required'
            function hide(section, inputs) {
                section.classList.add('hidden');
                inputs.forEach(input => input.required = false);
            }

            // Helper function to show section and add 'required'
            function show(section, inputs) {
                section.classList.remove('hidden');
                inputs.forEach(input => input.required = true);
            }

            // Reset all first
            hide(cardSection, cardInputs);
            hide(upiSection, upiInputs);
            hide(netSection, netInputs);

            // Show selected
            if (method === 'card') {
                show(cardSection, cardInputs);
            } else if (method === 'upi') {
                show(upiSection, upiInputs);
            } else if (method === 'netbanking') {
                show(netSection, netInputs);
            }
        }

        function resetForm() {
            // Wait a split second for the form to clear, then hide all dynamic fields
            setTimeout(() => {
                document.getElementById('section_card').classList.add('hidden');
                document.getElementById('section_upi').classList.add('hidden');
                document.getElementById('section_netbanking').classList.add('hidden');
            }, 10);
        }
    </script>

</body>
</html>
